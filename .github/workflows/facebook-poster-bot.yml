name: Facebook Poster Bot

on:
  schedule:
    # ── Mon–Thu: Special Peak Windows ──
    - cron: "0 6 * * 1-4"      # Weekday Lunch (11:30 AM SLT)
    - cron: "5 13 * * 1-4"     # Weekday Evening (18:35 PM SLT)

    # ── Friday: 1 General Anchor + 1 Special Lunch ──
    - cron: "0 3 * * 5"        # General Anchor 1 (08:30 AM SLT)
    - cron: "0 6 * * 5"        # Weekday Lunch (11:30 AM SLT)

    # ── Saturday: 1 Special Morning + 1 General Anchor ──
    - cron: "0 2 * * 6"        # Saturday Morning Special (07:30 AM SLT)
    - cron: "0 3 * * 6"        # General Anchor 1 (08:30 AM SLT)

    # ── Sunday: 2 General Anchors ──
    - cron: "0 3 * * 0"        # General Anchor 1 (08:30 AM SLT)
    - cron: "0 10 * * 0"       # General Anchor 2 (15:30 PM SLT)

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: facebook-poster-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Resolve Current Sri Lanka Date and Day
      - name: Calculate SLT Meta Information
        id: meta
        run: |
          SLT_DATE=$(date -d "+5 hours 30 minutes" +"%Y-%m-%d")
          SLT_DAY_OF_WEEK=$(date -d "+5 hours 30 minutes" +"%u") # 1=Mon, 7=Sun
          echo "date=$SLT_DATE" >> $GITHUB_OUTPUT
          echo "day=$SLT_DAY_OF_WEEK" >> $GITHUB_OUTPUT

          case "${{ github.event.schedule }}" in
            "0 6 * * 1-4"|"5 13 * * 1-4"|"0 6 * * 5"|"0 2 * * 6")
              echo "type=special" >> $GITHUB_OUTPUT ;;
            *)
              echo "type=general" >> $GITHUB_OUTPUT ;;
          esac

      # 2. Re-establish today's persistent state
      - name: Restore Daily Run Counter
        id: cache-counter
        uses: actions/cache/restore@v4
        with:
          path: .run_tracker.env
          key: run-tracker-${{ steps.meta.outputs.date }}

      # 3. Apply Multi-Slot Protection System
      - name: Evaluate Priority Slot Rules
        id: gatekeeper
        run: |
          if [ ! -f .run_tracker.env ]; then
            echo "TOTAL_RUNS=0" > .run_tracker.env
            echo "SPECIAL_RUNS=0" >> .run_tracker.env
          fi

          source .run_tracker.env
          CRON_TYPE="${{ steps.meta.outputs.type }}"
          DAY="${{ steps.meta.outputs.day }}"
          CRON_STR="${{ github.event.schedule }}"
          SHOULD_SKIP=false

          echo "Incoming Trigger: [$CRON_STR] ($CRON_TYPE)"
          echo "Current Daily State: Total=$TOTAL_RUNS, Special Runs=$SPECIAL_RUNS"

          # RULE 1: Enforce global limit of 2 completed posts max per calendar day
          if [ "$TOTAL_RUNS" -ge 2 ]; then
            echo "❌ Cap hit ($TOTAL_RUNS/2 posts completed). Cancelling run."
            SHOULD_SKIP=true
          fi

          # RULE 2: Sequence-Aware Reservation System for General Crons
          if [ "$SHOULD_SKIP" = "false" ] && [ "$CRON_TYPE" = "general" ]; then

            # Mon-Thu (2 Specials scheduled)
            if [ "$DAY" -le 4 ]; then
              TOTAL_EXPECTED_SPECIALS=2

            # Fri (1 Lunch Special scheduled)
            elif [ "$DAY" -eq 5 ]; then
              TOTAL_EXPECTED_SPECIALS=1

            # Sat (1 Morning Special scheduled)
            elif [ "$DAY" -eq 6 ]; then
              TOTAL_EXPECTED_SPECIALS=1

            # Sun (0 Specials scheduled)
            else
              TOTAL_EXPECTED_SPECIALS=0
            fi

            REMAINING_SPECIALS=$(( TOTAL_EXPECTED_SPECIALS - SPECIAL_RUNS ))
            AVAILABLE_SLOTS=$(( 2 - TOTAL_RUNS ))

            if [ "$REMAINING_SPECIALS" -ge "$AVAILABLE_SLOTS" ] && [ "$REMAINING_SPECIALS" -gt 0 ]; then
              echo "⚠️ Reservation Guard: Blocking General cron to reserve remaining slot for Special event."
              SHOULD_SKIP=true
            fi
          fi

          # Commit status checks
          if [ "$SHOULD_SKIP" = "true" ]; then
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            TOTAL_RUNS=$(( TOTAL_RUNS + 1 ))
            if [ "$CRON_TYPE" = "special" ]; then
              SPECIAL_RUNS=$(( SPECIAL_RUNS + 1 ))
            fi

            echo "TOTAL_RUNS=$TOTAL_RUNS" > .run_tracker.env
            echo "SPECIAL_RUNS=$SPECIAL_RUNS" >> .run_tracker.env
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "✅ Slot Authorized. Daily Target: $TOTAL_RUNS/2"
          fi

      # 4. Sync State to Cache Engine
      - name: Save Updated Counter State
        if: steps.gatekeeper.outputs.proceed == 'true' && github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: .run_tracker.env
          key: run-tracker-${{ steps.meta.outputs.date }}

      # 5. Gracefully terminate workflow early if skipped by rules
      - name: Verify Authorization
        if: steps.gatekeeper.outputs.proceed != 'true' && github.event_name == 'schedule'
        run: |
          echo "Slot denied by priority matrix. Safely shutting down."
          exit 0

      # ── Everything below only runs if the gatekeeper authorized this trigger ──

      # 6. Random delay (0 to 5 minutes)
      - name: Random delay within window
        if: github.event_name != 'schedule' || steps.gatekeeper.outputs.proceed == 'true'
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DELAY_SECONDS=$(( RANDOM % 301 ))
            echo "Sleeping ${DELAY_SECONDS}s (~$((DELAY_SECONDS/60)) min $((DELAY_SECONDS%60)) sec)"
            sleep "$DELAY_SECONDS"
          else
            echo "Manual trigger (workflow_dispatch) — skipping delay."
          fi

      - name: Restore Chrome login profiles from cache
        id: cache-restore
        if: github.event_name != 'schedule' || steps.gatekeeper.outputs.proceed == 'true'
        uses: actions/cache@v4
        with:
          path: profiles
          key: browser-profiles-${{ github.run_id }}
          restore-keys: |
            browser-profiles-

      - name: Seed profiles from committed zip (only if cache had nothing)
        if: github.event_name != 'schedule' || steps.gatekeeper.outputs.proceed == 'true'
        run: |
          if [ -d "profiles/facebook_stable_session" ]; then
            echo "Restored an existing session from cache — skipping seed."
          elif [ -f profiles.zip ]; then
            echo "No cached session found — seeding from profiles.zip"
            unzip -o profiles.zip -d .
          else
            echo "No cache and no profiles.zip found — profiles/ will be empty this run."
          fi

      - name: Install System Dependencies & Google Chrome
        if: github.event_name != 'schedule' || steps.gatekeeper.outputs.proceed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget python3-tk python3-dev
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          rm /tmp/chrome.deb

      - name: Install Python dependencies
        if: github.event_name != 'schedule' || steps.gatekeeper.outputs.proceed == 'true'
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ── FIRST ATTEMPT ──
      - name: Create screenshots directory
        if: github.event_name != 'schedule' || steps.gatekeeper.outputs.proceed == 'true'
        run: mkdir -p screenshots
      - name: Start VLESS proxy client
        env:
          VLESS_URL: ${{ secrets.VLESS_PROXY_URL }}
        run: |
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray

          python3 - << 'PYEOF'
          import os
          import json
          from urllib.parse import urlparse, parse_qs

          url = os.environ["VLESS_URL"]
          parsed = urlparse(url)
          qs = parse_qs(parsed.query)

          config = {
              "inbounds": [{
                  "port": 10808,
                  "listen": "127.0.0.1",
                  "protocol": "socks",
                  "settings": {"udp": True}
              }],
              "outbounds": [{
                  "protocol": "vless",
                  "settings": {
                      "vnext": [{
                          "address": parsed.hostname,
                          "port": parsed.port,
                          "users": [{
                              "id": parsed.username,
                              "flow": qs.get("flow", [""])[0],
                              "encryption": qs.get("encryption", ["none"])[0]
                          }]
                      }]
                  },
                  "streamSettings": {
                      "network": qs.get("type", ["tcp"])[0],
                      "security": qs.get("security", ["reality"])[0],
                      "realitySettings": {
                          "serverName": qs.get("sni", [""])[0],
                          "fingerprint": qs.get("fp", [""])[0],
                          "publicKey": qs.get("pbk", [""])[0],
                          "shortId": qs.get("sid", [""])[0]
                      }
                  }
              }]
          }

          with open("xray/config.json", "w") as f:
              json.dump(config, f, indent=2)
          PYEOF

              nohup ./xray/xray run -c xray/config.json > xray.log 2>&1 &
              sleep 3
              echo "Xray started, testing connection..."
              curl -s --max-time 10 -x socks5://127.0.0.1:10808 https://ifconfig.me || echo "⚠️ Proxy test failed"
      - name: Run Facebook Poster Bot
        id: bot
        if: github.event_name != 'schedule' || steps.gatekeeper.outputs.proceed == 'true'
        continue-on-error: true
        env:
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          WEBSHARE_API_URL: ${{ secrets.WEBSHARE_API_URL }}
          VLESS_URL: ${{ secrets.VLESS_PROXY_URL }}
          PROXY_HOST: "127.0.0.1"
          PROXY_PORT: "10808"
        run: python3 facebook_poster_bot.py

      # ── REBUILD ALERT & STEP ──
      - name: Send Telegram Alert - Rebuilding
        if: steps.bot.outcome != 'success' && (github.event_name != 'schedule' || steps.gatekeeper.outputs.proceed == 'true')
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=⚠️ *Facebook Poster Bot:* Non-200 code detected. Rebuilding profile..."

      - name: Rebuild Facebook profile and update seed zip
        if: steps.bot.outcome != 'success' && (github.event_name != 'schedule' || steps.gatekeeper.outputs.proceed == 'true')
        env:
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
        run: |
          rm -f profiles.zip
          python3 facebook_profile_initializer.py
          cd profiles/facebook_stable_session
          rm -rf "Default/Code Cache" "Default/Cache" optimization_guide_model_store component_crx_cache WasmTtsEngine || true
          cd ../..
          zip -r profiles.zip profiles/facebook_stable_session/ -x "*/Singleton*" "*/LOCK" "*/.com.google.Chrome.*" "*cache*"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profiles.zip
          git commit -m "Auto-rebuilt trimmed Facebook profile seed [skip ci]" || echo "No changes to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push

      # ── SECOND ATTEMPT ──
      - name: Retry Facebook Poster Bot with fresh profile
        id: bot_retry
        if: steps.bot.outcome != 'success' && (github.event_name != 'schedule' || steps.gatekeeper.outputs.proceed == 'true')
        env:
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          WEBSHARE_API_URL: ${{ secrets.WEBSHARE_API_URL }}
          VLESS_URL: ${{ secrets.VLESS_PROXY_URL }}
          PROXY_HOST: "127.0.0.1"
          PROXY_PORT: "10808"
        run: python3 facebook_poster_bot.py

      # ── ARTIFACTS & CACHE ──
      # Note: kept as always() intentionally — even skipped/denied runs should not
      # clobber prior artifacts silently, and if screenshots exist from a partial
      # run they're still worth capturing.
      - name: Upload screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots-${{ github.run_id }}
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save updated profiles back to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: profiles
          key: browser-profiles-${{ github.run_id }}

      # ── TELEGRAM SCREENSHOTS ──
      - name: Send all screenshots to Telegram
        if: always()
        run: |
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"
          SCREENSHOT_DIR="screenshots"

          mkdir -p "$SCREENSHOT_DIR"

          FILES=()
          while IFS= read -r -d '' f; do
            FILES+=("$f")
          done < <(find "$SCREENSHOT_DIR" -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) -print0 | sort -z)

          TOTAL=${#FILES[@]}
          echo "Found $TOTAL screenshot(s)."

          if [ "$TOTAL" -eq 0 ]; then
            echo "No screenshot images found — skipping Telegram upload."
            exit 0
          fi

          if [ "$TOTAL" -eq 1 ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
              -F "chat_id=${CHAT_ID}" \
              -F "photo=@${FILES[0]}" \
              -F "caption=📸 $(basename "${FILES[0]}") — run ${{ github.run_id }}" > /dev/null
            echo "Sent 1 screenshot via sendPhoto."
            exit 0
          fi

          BATCH_SIZE=10
          i=0
          while [ $i -lt "$TOTAL" ]; do
            BATCH=("${FILES[@]:i:BATCH_SIZE}")
            MEDIA_JSON="["
            CURL_ARGS=()
            for idx in "${!BATCH[@]}"; do
              ATTACH_NAME="file${idx}"
              if [ "$idx" -gt 0 ]; then MEDIA_JSON+=","; fi
              if [ "$idx" -eq 0 ] && [ "$i" -eq 0 ]; then
                CAPTION="📸 Screenshots — run ${{ github.run_id }} (${TOTAL} total)"
                MEDIA_JSON+="{\"type\":\"photo\",\"media\":\"attach://${ATTACH_NAME}\",\"caption\":\"${CAPTION}\"}"
              else
                MEDIA_JSON+="{\"type\":\"photo\",\"media\":\"attach://${ATTACH_NAME}\"}"
              fi
              CURL_ARGS+=(-F "${ATTACH_NAME}=@${BATCH[$idx]}")
            done
            MEDIA_JSON+="]"

            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup" \
              -F "chat_id=${CHAT_ID}" \
              -F "media=${MEDIA_JSON}" \
              "${CURL_ARGS[@]}" > /dev/null

            echo "Sent batch of ${#BATCH[@]} screenshot(s)."
            i=$((i + BATCH_SIZE))
          done

      # ── FINAL TELEGRAM NOTIFICATION ──
      - name: Send Final Telegram Status
        if: always()
        run: |
          POSTER="${{ steps.bot_retry.outputs.poster_number || steps.bot.outputs.poster_number || 'unknown' }}"
          TIME="${{ steps.bot_retry.outputs.published_time || steps.bot.outputs.published_time || 'unknown time' }}"
          # GROUPS="${{ steps.bot_retry.outputs.selected_groups || steps.bot.outputs.selected_groups || 'unknown groups' }}"
          STATUS="${{ steps.bot_retry.outputs.status || steps.bot.outputs.status || 'unknown status' }}"

          if [ "${{ steps.gatekeeper.outputs.proceed }}" = "false" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            MSG="⏭️ *Facebook Poster Bot:* Run skipped by priority matrix (daily cap reached or slot reserved)."
          elif [ "${{ job.status }}" = "success" ]; then
            MSG="✅ *Facebook Poster Bot:* poster-${POSTER} — ${STATUS} at ${TIME} to these groups ${GROUPS}"
          else
            MSG="❌ *Facebook Poster Bot:* Execution failed. Last known: poster-${POSTER}, ${STATUS} at ${TIME}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=${MSG}"