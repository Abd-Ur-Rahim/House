name: Facebook Poster Bot

on:
  schedule:
    # ── Peak windows ──
    - cron: "0 6 * * 1-5"     # Weekday lunch window opens 12:00 SLT, Mon–Fri
    - cron: "5 13 * * 1-4"    # Weekday evening window opens 19:05 SLT, Mon–Thu (offset 5m to avoid colliding with the 13:00 daily anchor below)
    - cron: "0 2 * * 6"       # Saturday morning window opens 08:00 SLT, Sat

    # ── General everyday coverage — 4x/day, every day, ~6h apart anchors ──
    - cron: "0 1 * * *"       # ~06:30 SLT
    - cron: "0 7 * * *"       # ~12:30 SLT
    - cron: "0 13 * * *"      # ~18:30 SLT
    - cron: "0 19 * * *"      # ~00:30 SLT
  workflow_dispatch: {}

concurrency:
  group: facebook-poster-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Random delay within window
        if: github.event_name == 'schedule'
        run: |
          case "${{ github.event.schedule }}" in
            "0 6 * * 1-5")
              WINDOW_MINUTES=119 ;;   # lunch peak: 12:00–13:59 SLT
            "5 13 * * 1-4")
              WINDOW_MINUTES=179 ;;   # evening peak: 19:05–22:04 SLT
            "0 2 * * 6")
              WINDOW_MINUTES=119 ;;   # Saturday morning peak: 08:00–09:59 SLT
            "0 1 * * *"|"0 7 * * *"|"0 13 * * *"|"0 19 * * *")
              WINDOW_MINUTES=119 ;;   # general everyday anchors: ~2h jitter each
            *)
              WINDOW_MINUTES=0 ;;
          esac

          DELAY_SECONDS=$(( RANDOM % (WINDOW_MINUTES * 60 + 1) ))
          echo "Trigger: ${{ github.event.schedule }} — sleeping ${DELAY_SECONDS}s (~$((DELAY_SECONDS/60)) min)"
          sleep "$DELAY_SECONDS"

      - name: Restore Chrome login profiles from cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: profiles
          key: browser-profiles-${{ github.run_id }}
          restore-keys: |
            browser-profiles-

      # SEED FALLBACK: only runs if nothing usable was restored from cache
      # above. This checks the actual folder on disk rather than the
      # cache-hit output, because cache-hit is only true on an EXACT key
      # match — and our key intentionally includes the run ID so a fresh
      # cache entry is saved every run. The restore step above still
      # correctly pulls the most recent prior session via restore-keys
      # prefix matching; that just doesn't count as an "exact hit."
      - name: Seed profiles from committed zip (only if cache had nothing)
        run: |
          if [ -d "profiles/facebook_stable_session" ]; then
            echo "Restored an existing session from cache — skipping seed."
          elif [ -f profiles.zip ]; then
            echo "No cached session found — seeding from profiles.zip"
            unzip -o profiles.zip -d .
          else
            echo "No cache and no profiles.zip found — profiles/ will be empty this run."
          fi

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          rm /tmp/chrome.deb

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Facebook Poster Bot
        env:
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          WHATSAPP_NOTIFY_PHONE: ${{ secrets.WHATSAPP_NOTIFY_PHONE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 facebook_poster_bot.py

      - name: Save updated profiles back to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: profiles
          key: browser-profiles-${{ github.run_id }}